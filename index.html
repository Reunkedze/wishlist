<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />
  <title>Birthday Wishlist</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #0f1115;
      color: white;
      min-height: 100vh;
      padding: 20px;
      background-image: url('./telegram-cloud-photo-size-2-5345977039678281976-y.jpg');
      background-position: center;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
    }

    .subtitle {
      color: #fff;
      margin-bottom: 30px;
      line-height: 1.5;
    }

    .wishlist {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .gift-card {
      background: #1a1d24;
      border: 1px solid #2c313c;
      border-radius: 20px;
      padding: 20px;
      transition: 0.2s;
      position: relative;
      overflow: hidden;
    }

    .gift-card.selected {
      border-color: #34c759;
      background: #132218;
    }

    .gift-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
    }

    .gift-info {
      flex: 1;
    }

    .gift-title {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .gift-description {
      color: #a5adbb;
      line-height: 1.5;
    }

    .gift-price {
      margin-top: 12px;
      font-size: 18px;
      font-weight: bold;
    }

    .gift-actions {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
    }

    button {
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .select-btn {
      background: #3b82f6;
      color: white;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
    }

    .select-btn:hover {
      opacity: 0.9;
    }

    .select-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .giver {
      color: #7ee787;
      font-size: 14px;
      text-align: right;
      line-height: 1.4;
    }

    .status {
      position: absolute;
      top: 14px;
      right: 14px;
      background: #34c759;
      color: white;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: bold;
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 999;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 420px;
      background: #1a1d24;
      border-radius: 24px;
      padding: 24px;
      border: 1px solid #2c313c;
    }

    .modal-title {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .modal-subtitle {
      color: #a5adbb;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .input {
      width: 100%;
      background: #0f1115;
      border: 1px solid #2c313c;
      border-radius: 12px;
      padding: 14px;
      color: white;
      font-size: 16px;
      outline: none;
      margin-bottom: 16px;
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
    }

    .confirm-btn {
      flex: 1;
      background: #34c759;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
    }

    .cancel-btn {
      flex: 1;
      background: #2c313c;
      color: white;
      padding: 14px;
      border-radius: 12px;
      font-weight: bold;
    }

    .loader {
      margin-top: 30px;
      color: #a5adbb;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 26px;
      }

      .gift-header {
        flex-direction: column;
        align-items: stretch;
      }

      .gift-actions {
        align-items: stretch;
      }

      .giver {
        text-align: left;
      }

      .select-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🎁 Birthday Wishlist</h1>

  <p class="subtitle">
    Если подарок уже кто-то выбрал — он мгновенно отобразится на всех устройствах.
  </p>

  <div class="wishlist" id="wishlist">
    <div class="loader">Загрузка...</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 class="modal-title">Выбрать подарок</h2>

    <p class="modal-subtitle">
      Напиши своё имя, чтобы другие знали, кто дарит подарок ✨
    </p>

    <input
      type="text"
      id="giverInput"
      class="input"
      placeholder="Напиши, кто ты, или какое нибудь поздравление милое, мне приятно будет :)"
      maxlength="40"
    />

    <div class="modal-buttons">
      <button class="cancel-btn" id="cancelBtn">
        Отмена
      </button>

      <button class="confirm-btn" id="confirmBtn">
        Подтвердить
      </button>
    </div>
  </div>
</div>

<script type="module">
  // =========================
  // FIREBASE CONFIG
  // =========================
  // ВСТАВЬ СВОИ ДАННЫЕ FIREBASE
  // https://console.firebase.google.com/

  const firebaseConfig = {
    apiKey: "AIzaSyCi6t-RPyWIpxMdQ-e4ANS6Vz9Wg582CPU",
    authDomain: "wishlist-32ac2.firebaseapp.com",
    projectId: "wishlist-32ac2",
    storageBucket: "wishlist-32ac2.appspot.com",
    messagingSenderId: "811106739595",
    appId: "1:811106739595:web:d6583231f64eade1c47b8e"
  };

  // =========================
  // FIREBASE IMPORTS
  // =========================

  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-app.js";

  import {
    getFirestore,
    doc,
    onSnapshot,
    runTransaction,
    setDoc
  } from "https://www.gstatic.com/firebasejs/11.9.1/firebase-firestore.js";

  // =========================
  // INIT
  // =========================

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // =========================
  // MOCK DATA
  // =========================
  // Удали и добавь свои товары по аналогии

  const gifts = [
    {
      id: "gift-1",
      title: "Sony WH-1000XM5",
      description: "Беспроводные наушники с шумоподавлением",
      price: "399€"
    },
    {
      id: "gift-2",
      title: "Какая то",
      description: "Книга",
      price: "399€"
    }
  ];

  // =========================
  // STATE
  // =========================

  const wishlist = document.getElementById("wishlist");

  const modal = document.getElementById("modal");
  const giverInput = document.getElementById("giverInput");

  const confirmBtn = document.getElementById("confirmBtn");
  const cancelBtn = document.getElementById("cancelBtn");

  let currentGiftId = null;

  // =========================
  // RENDER
  // =========================

  function renderGift(giftId, data) {
    let card = document.querySelector(`[data-id="${giftId}"]`);

    if (!card) {
      card = document.createElement("div");
      card.className = "gift-card";
      card.dataset.id = giftId;

      wishlist.appendChild(card);
    }

    card.classList.toggle("selected", data.selected);

    card.innerHTML = `
      ${data.selected ? `<div class="status">Выбран</div>` : ""}

      <div class="gift-header">
        <div class="gift-info">
          <div class="gift-title">${data.title}</div>

          <div class="gift-description">
            <a href="${data.description}">Ссылка</a>
          </div>

          <div class="gift-price">
            ${data.price}
          </div>
        </div>

        <div class="gift-actions">
          ${
            data.selected
              ? `
                <div class="giver">
                  🎉 Дарит:<br>
                  <strong>${escapeHtml(data.selectedBy)}</strong>
                </div>
              `
              : `
                <button class="select-btn">
                  Выбрать подарок
                </button>
              `
          }
        </div>
      </div>
    `;

    if (!data.selected) {
      const btn = card.querySelector(".select-btn");

      btn.addEventListener("click", () => {
        currentGiftId = giftId;
        giverInput.value = "";
        modal.classList.add("active");
      });
    }
  }

  // =========================
  // REALTIME LISTENERS
  // =========================
  // Firestore использует realtime websocket
  // обновления прилетают мгновенно

  gifts.forEach(gift => {
    const ref = doc(db, "wishlist", gift.id);

    onSnapshot(ref, (snapshot) => {
      const data = snapshot.data();

      document.querySelector(".loader")?.remove();

      renderGift(gift.id, data);
    });
  });

  // =========================
  // MODAL
  // =========================

  cancelBtn.addEventListener("click", () => {
    modal.classList.remove("active");
  });

  modal.addEventListener("click", (e) => {
    if (e.target === modal) {
      modal.classList.remove("active");
    }
  });

  // =========================
  // SELECT GIFT
  // =========================
  // Защита от двойного выбора:
  // используется transaction.
  // Если подарок уже выбрали —
  // второй человек не сможет занять его.

  confirmBtn.addEventListener("click", async () => {
    const giverName = giverInput.value.trim();

    if (!giverName) {
      alert("Введите имя");
      return;
    }

    confirmBtn.disabled = true;

    try {
      const ref = doc(db, "wishlist", currentGiftId);

      await runTransaction(db, async (transaction) => {
        const snap = await transaction.get(ref);

        if (!snap.exists()) {
          throw new Error("Подарок не найден");
        }

        const data = snap.data();

        // защита от гонки
        if (data.selected) {
          throw new Error("Этот подарок уже выбрали");
        }

        transaction.update(ref, {
          selected: true,
          selectedBy: giverName
        });
      });

      modal.classList.remove("active");

    } catch (err) {
      alert(err.message);
    } finally {
      confirmBtn.disabled = false;
    }
  });

  // =========================
  // XSS PROTECTION
  // =========================

  function escapeHtml(str) {
    return str
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }
</script>

</body>
</html>
